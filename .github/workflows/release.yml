# Push a tag like v0.1.0 to build the three portable packages and publish a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          curl -fsSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ff.zip
          mkdir OtoView
          cp target/release/otoview.exe ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe OtoView/
          cp ffmpeg-master-latest-win64-gpl/LICENSE.txt OtoView/FFMPEG-LICENSE.txt
          cp README.md LICENSE-MIT LICENSE-APACHE OtoView/
          7z a OtoView-windows-x64.zip OtoView
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: OtoView-windows-x64.zip }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
      - name: Package
        run: |
          set -e
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APP=OtoView.app/Contents
          mkdir -p $APP/MacOS $APP/Resources
          lipo -create -output $APP/MacOS/otoview \
            target/x86_64-apple-darwin/release/otoview target/aarch64-apple-darwin/release/otoview

          # Static FFmpeg for each architecture, merged into one universal binary.
          for arch in amd64 arm64; do
            curl -fsSL -o ff-$arch.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/$arch/release/ffmpeg.zip
            unzip -q -o ff-$arch.zip -d ff-$arch
          done
          lipo -create -output $APP/MacOS/ffmpeg ff-amd64/ffmpeg ff-arm64/ffmpeg
          chmod +x $APP/MacOS/ffmpeg

          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/logo-512.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2)); [ $d -le 512 ] && sips -z $d $d assets/logo-512.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o $APP/Resources/OtoView.icns

          cat > $APP/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>OtoView</string>
            <key>CFBundleDisplayName</key><string>OtoView</string>
            <key>CFBundleIdentifier</key><string>io.github.otoview</string>
            <key>CFBundleExecutable</key><string>otoview</string>
            <key>CFBundleIconFile</key><string>OtoView</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSLocalNetworkUsageDescription</key><string>OtoView talks to the endoscope on its own Wi-Fi network.</string>
          </dict></plist>
          EOF

          codesign --force --deep --sign - OtoView.app
          ditto -c -k --keepParent OtoView.app OtoView-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: OtoView-macos-universal.zip }

  linux:
    # Oldest supported runner, so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfuse2
      - run: cargo build --release
      - name: Package
        run: |
          set -e
          mkdir -p AppDir/usr/bin
          cp target/release/otoview AppDir/usr/bin/
          curl -fsSL -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ff.tar.xz
          cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg AppDir/usr/bin/
          cp ffmpeg-master-latest-linux64-gpl/LICENSE.txt AppDir/FFMPEG-LICENSE.txt
          cp assets/logo-512.png AppDir/otoview.png
          ln -s usr/bin/otoview AppDir/AppRun
          printf '[Desktop Entry]\nType=Application\nName=OtoView\nComment=Wi-Fi ear endoscope viewer\nExec=otoview\nIcon=otoview\nCategories=AudioVideo;Video;\n' > AppDir/otoview.desktop
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir OtoView-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: OtoView-linux-x86_64.AppImage }

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes OtoView-*
