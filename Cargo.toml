[package]
name = "otoview"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Open-source desktop app for Wi-Fi ear endoscopes (otoscopes): live view, photos, video and AI eardrum detection"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gianmarcobonan/otoview"
readme = "README.md"
keywords = ["otoscope", "endoscope", "wifi", "camera", "egui"]
categories = ["multimedia::video", "gui"]
exclude = ["docs/*"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = "0.37.0"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
sys-locale = "0.3.2"
tract-tflite = "0.23.10"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
